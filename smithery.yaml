version: 1
name: dora
displayName: Dora
description: AI video and image generation MCP server for ChatGPT, Claude, Cursor and Google Antigravity. One OAuth-secured endpoint exposes 12 models (Seedance 2 Mini, Seedance 2, Kling 2.6 Motion Control, Grok Imagine, Nano Banana 2 and Pro, GPT Image, z-image) with the coin cost of each returned before generating, cheapest first.
homepage: https://doravideo.com
documentation: https://doravideo.com/ai-video-mcp
deployment:
  remote:
    url: https://doravideo.com/mcp
    transport: streamable-http
    auth:
      type: oauth
      pkce: true
      dynamicClientRegistration: true
tags:
